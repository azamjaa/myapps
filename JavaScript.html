  user: null,
  page: 'apps',
  appsFilter: { search: '', kategori: 0, sso: 0 },
  staffFilter: { search: '', bahagian: 0 },
  chartInstance: null,
  charts: [],
  sessionToken: '',
  appsCache: {},
  usersCache: {}
};

var SESSION_KEY = 'myapps_session';

function getSessionToken() {
  if (state.sessionToken) return state.sessionToken;
  try { return sessionStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; }
}

function setSessionToken(token) {
  state.sessionToken = token || '';
  try {
    if (token) sessionStorage.setItem(SESSION_KEY, token);
    else sessionStorage.removeItem(SESSION_KEY);
  } catch (e) {}
}

function run(fnName, args) {
  var token = getSessionToken();
  var skipToken = fnName === 'apiLoginWithGoogle' || fnName === 'apiGetAuthConfig' || fnName === 'apiPing';
  var callArgs = skipToken ? (args || []) : [token].concat(args || []);
  return new Promise(function (resolve, reject) {
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      reject(new Error('Server tidak respons. Sila refresh halaman — jika Google minta kebenaran, klik Allow.'));
    }, 90000);
    google.script.run
      .withSuccessHandler(function (res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(res);
      })
      .withFailureHandler(function (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        var msg = (err && err.message) ? err.message : String(err || 'Ralat server');
        reject(new Error(msg));
      })
      [fnName].apply(null, callArgs);
  });
}

function $(id) { return document.getElementById(id); }

function show(el, on) {
  if (!el) return;
  el.classList.toggle('hidden', !on);

function setAlert(id, msg, type) {
  var el = $(id);
  if (!el) return;
  if (!msg) { el.className = 'hidden'; el.innerHTML = ''; return; }
  el.className = 'alert alert-' + (type || 'danger');
  el.innerHTML = msg;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function togglePass(id) { /* tidak digunakan — Google SSO */ }

  var cls = id === 1 ? 'badge-blue' : id === 2 ? 'badge-red' : 'badge-purple';
  return '<span class="badge ' + cls + '">' + esc(name) + '</span>';
}

function safeAppColor(a) {
  if (a && a.id_kategori === 1) return '#2F6FED';
  if (a && a.id_kategori === 2) return '#C8102E';
  if (a && a.id_kategori === 3) return '#6C3483';
  return '#2F6FED';
}

function uniquifySvgIds(svg, prefix) {
  return String(svg || '')

function appIconKey(nama, keterangan) {
  var t = String(nama || '').toLowerCase().replace(/\s+/g, ' ').trim();
  var exact = {
    'emas care': 'clinic', ecare: 'clinic',
    eperjalanan: 'travel', epelawat: 'visitor', etanah: 'land',
    eutiliti: 'utility', hrmis: 'hr', mygovuc: 'email',
    mydaftar: 'register', kedamap: 'map', mypprs: 'housing',
    myapps: 'apps', saga: 'finance', 'staff portal': 'payslip',
    fer: 'counter', tms: 'rental', smp: 'student',
    gasset: 'asset', gstore: 'store', gfixed: 'building',
    glive: 'livestock', gintan: 'diamond', ejawatan: 'job',
    spbk: 'aid', mypremis: 'premis', kedapay: 'pay',
    daftarkolej: 'student', 'portal keda': 'web',
    'portal kolej keda': 'college', myprojek: 'project',
    mymesyuarat: 'meeting', ekasih: 'heart', sispaa: 'complaint',
    sbsys: 'gov', myspike: 'skill', ecos: 'energy',
    spkpn: 'village', ddms: 'docs', mystaf: 'staff',
    mydashboard: 'chart', mydesa: 'village'
  };
  if (exact[t]) return exact[t];
  var blob = t + ' ' + String(keterangan || '').toLowerCase();
  var rules = [
    [/klinik|kesihatan|hospital|care/, 'clinic'],
    [/perjalanan|travel/, 'travel'],
    [/pelawat|visitor/, 'visitor'],
    [/geospatial|peta|map/, 'map'],
    [/tanah/, 'land'],
    [/utiliti|elektrik|tenaga|bil/, 'utility'],
    [/emel|email|mail/, 'email'],
    [/sumber manusia|hrmis|staf/, 'staff'],
    [/daftar|pendaftaran|acara/, 'register'],
    [/perumahan|rumah|pprs/, 'housing'],
    [/kewangan|gaji|bayar|pay|saga/, 'finance'],
    [/kaunter|kutipan/, 'counter'],
    [/premis/, 'premis'],
    [/sewa/, 'rental'],
    [/kolej/, 'college'],
    [/pelajar|kemahiran/, 'student'],
    [/stor|gudang/, 'store'],
    [/aset hidup|ternakan|tanaman/, 'livestock'],
    [/aset tak ketara|intan/, 'diamond'],
    [/aset tak alih|bangunan/, 'building'],
    [/aset/, 'asset'],
    [/jawatan|kerja/, 'job'],
    [/bantuan|kasih/, 'aid'],
    [/projek/, 'project'],
    [/mesyuarat/, 'meeting'],
    [/aduan/, 'complaint'],
    [/dokumen|fail|ddms/, 'docs'],
    [/dashboard|carta|pencapaian/, 'chart'],
    [/kampung|desa|profil/, 'village'],
    [/portal|laman web|website/, 'web']
  ];
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][0].test(blob)) return rules[i][1];
  }
  return 'apps';
}

function appIconHtml(a) {
  var key = appIconKey(a.nama_aplikasi, a.keterangan);
  var svg = APP_ICONS[key] || APP_ICONS.apps;
  svg = uniquifySvgIds(svg, 'a' + (a.id_aplikasi || 'x') + '-');
  return '<span class="app-favicon">' + svg + '</span>';
}

function downloadCsv(filename, csv) {
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ── Auth (Google SSO + session token) ── */
function finishLogin(data) {
  state.user = data.user;
  if (data.sessionToken) setSessionToken(data.sessionToken);
  showAuthGate(false);
  hideGoogleSignIn();
  showApp();
  navigate(window.INITIAL_PAGE || state.page || 'apps');
}

function showGoogleSignIn() {
  show($('googleSignInWrap'), true);
}

function hideGoogleSignIn() {
  show($('googleSignInWrap'), false);
  var btn = $('googleSignInBtn');
  if (btn) btn.innerHTML = '';
}

function waitForGoogleGsi() {
  return new Promise(function (resolve, reject) {
    if (window.google && google.accounts && google.accounts.id) return resolve();
    var n = 0;
    var timer = setInterval(function () {
      if (window.google && google.accounts && google.accounts.id) {
        clearInterval(timer);
        resolve();
      } else if (++n > 80) {
        clearInterval(timer);
        reject(new Error('Google Sign-In tidak dimuatkan. Semak sambungan internet.'));
      }
    }, 100);
  });
}

var googleSignInInit = false;

async function initGoogleSignIn() {
  showGoogleSignIn();
  try {
    var cfg = await run('apiGetAuthConfig', []);
    if (!cfg || !cfg.success || !cfg.data || !cfg.data.clientId) {
      setAuthAlert(
        'Log masuk automatik gagal. Pastikan anda log masuk Google di browser, atau hubungi pentadbir (Client ID belum diset).',
        'danger'
      );
      show($('btnRetryAuth'), true);
      return;
    }
    await waitForGoogleGsi();
    if (googleSignInInit) {
      google.accounts.id.prompt();
      return;
    }
    googleSignInInit = true;
    google.accounts.id.initialize({
      client_id: cfg.data.clientId,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
      itp_support: true
    });
    google.accounts.id.renderButton($('googleSignInBtn'), {
      theme: 'outline',
      size: 'large',
      width: Math.min(300, Math.max(240, (window.innerWidth || 320) - 80)),
      text: 'signin_with',
      locale: 'ms'
    });
    google.accounts.id.prompt(function (notification) {
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        setAuthAlert('Sila klik butang Google di bawah untuk log masuk.', 'info');
      }
    });
  } catch (e) {
    setAuthAlert((e && e.message) || 'Gagal memuatkan log masuk Google.', 'danger');
    show($('btnRetryAuth'), true);
  }
}

async function handleGoogleCredential(resp) {
  if (!resp || !resp.credential) return;
  setAuthAlert('Mengesahkan akaun Google...', 'info');
  hideGoogleSignIn();
  show($('btnRetryAuth'), false);
  try {
    var res = await run('apiLoginWithGoogle', [resp.credential]);
    if (!res || !res.success) throw new Error((res && res.message) || 'Log masuk gagal.');
    finishLogin(res.data);
  } catch (e) {
    var msg = (e && e.message) ? e.message : String(e || 'Log masuk gagal.');
    setAuthAlert(msg, 'danger');
    show($('btnRetryAuth'), true);
    googleSignInInit = false;
    await initGoogleSignIn();
  }
}

async function bootstrap() {
  showAuthGate(true);
  setAuthAlert('Memuatkan akaun Google anda...', 'info');
  show($('btnRetryAuth'), false);
  hideGoogleSignIn();
  googleSignInInit = false;
  try {
    var ping = await run('apiPing', []);
    if (!ping || !ping.success) throw new Error((ping && ping.message) || 'Server tidak respons.');

    var res = await run('apiGetMe', []);
    if (res && res.success && res.data && res.data.user) {
      finishLogin(res.data);
      return;
    }
    throw new Error((res && res.message) || 'Sila log masuk dengan Google.');
  } catch (e) {
    var msg = (e && e.message) ? e.message : String(e || 'Ralat tidak diketahui');
    if (msg.indexOf('Sila log masuk') >= 0 || msg.indexOf('tidak berdaftar') >= 0 || msg.indexOf('tidak aktif') >= 0) {
      setAuthAlert(msg, msg.indexOf('tidak berdaftar') >= 0 || msg.indexOf('tidak aktif') >= 0 ? 'danger' : 'info');
    } else {
      setAuthAlert('Sila log masuk dengan akaun Google berdaftar.', 'info');
    }
    show($('btnRetryAuth'), true);
    await initGoogleSignIn();
  }
}

function showAuthGate(on) {
  show($('viewAuthGate'), on);
  show($('viewApp'), false);
  show($('chatFab'), false);
}

function setAuthAlert(msg, type) {
  var el = $('authAlert');
  if (!el) return;
  el.className = 'alert alert-' + (type || 'info');
  el.textContent = msg;
}

function showApp() {
  show($('viewAuthGate'), false);
  show($('viewApp'), true);
  show($('chatFab'), true);
  $('userChip').innerHTML = '<strong>' + esc(state.user.nama) + '</strong><br><small>' + esc(state.user.emel) + '</small>';
  show($('navAdmin'), !!state.user.isAdmin);
  show($('navUsers'), !!state.user.isAdmin);
}

/* ── Auth ── */
async function doLogout() {
  try { await run('apiLogout', []); } catch (e) {}
  setSessionToken('');
  state.user = null;
  googleSignInInit = false;
  showAuthGate(true);
  setAuthAlert('Sila log masuk semula dengan akaun Google berdaftar.', 'info');
  show($('btnRetryAuth'), true);
  await initGoogleSignIn();
}

/* ── Navigation (top pills) ── */
function toggleMobileNav() {}
function closeMobileNav() {}
function openMobileNav() {}

function navigate(page) {
  state.page = page;
  $('pageTitle').textContent = PAGE_TITLES[page] || page;
  document.querySelectorAll('.nav-pill').forEach(function (btn) {
    var p = btn.getAttribute('data-page');
    btn.classList.toggle('active', p === page || (page === 'apps-sso' && p === 'apps'));
  });
  $('topbarActions').innerHTML = '';
  var content = $('pageContent');
  if (content) {
    content.style.animation = 'none';
    void content.offsetHeight;
    content.style.animation = '';
  }
  if (page === 'apps') loadAppsByKat(0);
  else if (page === 'apps-dalaman') loadAppsByKat(1);
  else if (page === 'apps-luaran') loadAppsByKat(2);
  else if (page === 'apps-gunasama') loadAppsByKat(3);
  else if (page === 'apps-sso') loadAppsSso();
  else if (page === 'mystaf') loadStaff();
  else if (page === 'mydashboard') loadDashboard();
  else if (page === 'birthday') loadBirthdays();
  else if (page === 'admin-apps') loadAdminApps();
  else if (page === 'admin-users') loadAdminUsers();
}

function openAppUrl(app) {
  var url = app.url || '';
  if (!url) return;
  if (url.indexOf('#page=') === 0) {
    navigate(url.replace('#page=', ''));
    return;
  }
  if (url.indexOf('http') === 0) {
    window.open(url, '_blank');
    return;
  }
  window.open(url, '_blank');
}

/* ── Apps Directory ── */
function loadAppsByKat(kategori) {
  state.appsFilter.kategori = kategori || 0;
  state.appsFilter.sso = 0;
  state.appsFilter.search = '';
  loadApps();
}

function loadAppsSso() {
  state.appsFilter.kategori = 0;
  state.appsFilter.sso = 1;
  state.appsFilter.search = '';

function renderBarChart(canvasId, data) {
  var ctx = $(canvasId);
  if (!ctx || !data || !data.length) return;
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js belum dimuatkan');
    return;
  }
  try {
    var chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.map(function (d) { return d.name.length > 30 ? d.name.substr(0, 30) + '...' : d.name; }),
        datasets: [{ label: 'Jumlah', data: data.map(function (d) { return d.total; }), backgroundColor: '#C8102E', borderRadius: 6 }]
      },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } } } }
    });
    state.charts.push(chart);
  } catch (err) {
    console.warn(err);
  }
}

/* ── Birthdays (calendar) ── */
async function loadBirthdays() {
  $('pageContent').innerHTML = '<div class="empty-state">Memuatkan kalendar...</div>';
  try {
    var res = await run('apiGetBirthdays', []);
    if (!res.success) throw new Error(res.message);
    var months = ['', 'Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
    var monthsShort = ['', 'Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogos', 'Sep', 'Okt', 'Nov', 'Dis'];
    var weekDays = ['Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab', 'Ahd'];
    var month = toIntSafe(res.data.month, new Date().getMonth() + 1);
    var year = new Date().getFullYear();
    var today = new Date();
    var todayDay = (today.getMonth() + 1 === month && today.getFullYear() === year) ? today.getDate() : 0;
    var birthdays = res.data.birthdays || [];

    var byDay = {};
    birthdays.forEach(function (b) {
      var d = toIntSafe(b.hari, 0);
      if (d < 1 || d > 31) return;
      if (!byDay[d]) byDay[d] = [];
      byDay[d].push(b);
    });

    var first = new Date(year, month - 1, 1);
    var daysInMonth = new Date(year, month, 0).getDate();
    var startPad = (first.getDay() + 6) % 7;

    var html = '';
    html += '<div class="bday-layout">';
    html += '<div class="bday-cal panel">';
    html += '<div class="bday-cal-head">';
    html += '<div class="bday-cal-title"><span class="bday-cal-label">Kalendar Hari Lahir</span>';
    html += '<h3>' + months[month] + ' ' + year + '</h3>';
    html += '<p>' + birthdays.length + ' staf menyambut hari lahir bulan ini</p></div>';
    html += '<div class="bday-cal-stat"><strong>' + birthdays.length + '</strong><span>Hari Lahir</span></div>';
    html += '</div>';

    html += '<div class="bday-weekhead">';
    weekDays.forEach(function (w) { html += '<div>' + w + '</div>'; });
    html += '</div>';

    html += '<div class="bday-grid">';
    var i;
    for (i = 0; i < startPad; i++) html += '<div class="bday-cell empty"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var list = byDay[day] || [];
      var isToday = day === todayDay;
      var hasBday = list.length > 0;
      var cls = 'bday-cell' + (isToday ? ' is-today' : '') + (hasBday ? ' has-bday' : '');
      html += '<button type="button" class="' + cls + '" data-day="' + day + '" onclick="selectBdayDay(' + day + ')">';
      html += '<span class="bday-daynum">' + day + '</span>';
      if (hasBday) {
        html += '<span class="bday-count">' + list.length + '</span>';
        html += '<div class="bday-dots">';
        list.slice(0, 3).forEach(function () { html += '<i></i>'; });
        html += '</div>';
        html += '<div class="bday-preview">' + esc(String(list[0].nama || '').split(' ')[0]) + (list.length > 1 ? ' +' + (list.length - 1) : '') + '</div>';
      }
      html += '</button>';
    }
    html += '</div></div>';

    html += '<div class="bday-side">';
    html += '<div class="panel bday-side-panel" id="bdayDetail"></div>';
    html += '<div class="panel bday-upcoming">';
    html += '<h4>Senarai Bulan Ini</h4>';
    if (!birthdays.length) {
      html += '<div class="empty-state" style="padding:20px">Tiada hari lahir bulan ini.</div>';
    } else {
      html += '<div class="bday-list">';
      birthdays.forEach(function (b) {
        var nama = String(b.nama || '-');
        html += '<button type="button" class="bday-list-item" onclick="selectBdayDay(' + toIntSafe(b.hari, 1) + ')">';
        html += '<div class="bday-list-date"><strong>' + toIntSafe(b.hari, '-') + '</strong><span>' + monthsShort[month] + '</span></div>';
        html += '<div class="bday-list-info"><strong>' + esc(nama) + '</strong><span>' + esc(b.bahagian || '') + '</span></div>';
        html += '</button>';
      });
      html += '</div>';
    }
    html += '</div></div></div>';

    state.bdayByDay = byDay;
    state.bdayMonthShort = monthsShort[month];
    $('pageContent').innerHTML = html;
    var firstBday = Object.keys(byDay).map(Number).sort(function (a, b) { return a - b; })[0] || 1;
    selectBdayDay(todayDay || firstBday);
  } catch (e) {
    $('pageContent').innerHTML = '<div class="alert alert-danger">' + esc(e.message) + '</div>';
  }
}

function toIntSafe(v, def) {
  var n = parseInt(v, 10);
  return isNaN(n) ? def : n;
}

function renderBdayDetail_(byDay, day, monthShort) {
  var list = (byDay && byDay[day]) || [];
  var html = '<div class="bday-detail-head"><span>Tarikh dipilih</span><h3>' + day + ' ' + esc(monthShort || '') + '</h3></div>';
  if (!list.length) {
    html += '<div class="empty-state" style="padding:28px 12px">Tiada hari lahir pada hari ini.</div>';
    return html;
  }
  html += '<div class="bday-detail-list">';
  list.forEach(function (b) {
    var nama = String(b.nama || '-');
    html += '<div class="bday-detail-card">';
    html += '<div class="staff-avatar">' + esc(nama.charAt(0) || '?') + '</div>';
    html += '<div><strong>' + esc(nama) + '</strong><p>' + esc(b.bahagian || '') + '</p></div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function selectBdayDay(day) {
  day = toIntSafe(day, 1);
  document.querySelectorAll('.bday-cell').forEach(function (el) {
    el.classList.toggle('is-selected', toIntSafe(el.getAttribute('data-day'), 0) === day);
  });
  var box = $('bdayDetail');
  if (box) box.innerHTML = renderBdayDetail_(state.bdayByDay || {}, day, state.bdayMonthShort || '');
}

    closeModal();
    loadAdminUsers();
  } catch (e) { alert(e.message); }
}

/* ── Modal ── */
function closeModal() { show($('modalOverlay'), false); }

/* ── Chatbot ── */
function toggleChat() {
  var panel = $('chatPanel');
  show(panel, panel.classList.contains('hidden'));
}

async function sendChat() {
  var input = $('chatInput');
  var msg = (input.value || '').trim();
  if (!msg) return;
  input.value = '';
  var box = $('chatMessages');
  box.innerHTML += '<div class="chat-msg user">' + esc(msg) + '</div>';
  box.scrollTop = box.scrollHeight;
  try {
    var res = await run('apiChatbot', [msg]);
    var reply = res.success ? res.data.reply : (res.message || 'Ralat.');
    box.innerHTML += '<div class="chat-msg bot">' + reply + '</div>';
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.innerHTML += '<div class="chat-msg bot">Maaf, ralat berlaku.</div>';
  }
}

document.addEventListener('DOMContentLoaded', bootstrap);
</script>
