<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MyApps KEDA — Direktori Aplikasi KEDA">
  <link rel="canonical" href="https://keda.gov.my/myapps/">
  <title>MyApps KEDA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 2;
      transition: opacity .3s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #F39C12;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #F39C12;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-top: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">K</div>
    <strong>MyApps KEDA</strong>
    <div style="opacity:.75;font-size:14px;margin-top:4px">Memuatkan portal...</div>
    <div class="spinner"></div>
  </div>
  <iframe
    id="appFrame"
    title="MyApps KEDA"
    src="https://script.google.com/a/macros/keda.gov.my/s/AKfycbxpDPSF8z4q6ZJjtniCPlOVR_5HhOnR1gBz_LtQsNhT2slAwAYVND8TZI42AJcHV6y0Og/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      var loading = document.getElementById('loading');
      function hideLoading() {
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 350);
      }
      frame.addEventListener('load', hideLoading);
      setTimeout(hideLoading, 8000);
    })();
  </script>
</body>
</html>
